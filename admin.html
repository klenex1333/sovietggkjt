<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в систему управления МС</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 1.5rem; }
        .card { background: #1e293b; padding: 2.5rem; border-radius: 16px; box-shadow: 0 15px 30px rgba(0,0,0,0.4); max-width: 450px; width: 100%; border: 1px solid rgba(255,255,255,0.05); }
        h2 { font-size: 1.75rem; font-weight: 800; margin-bottom: 1.5rem; text-align: center; color: #fff; }
        label { display: block; font-size: 0.875rem; font-weight: 600; color: #94a3b8; margin-bottom: 0.5rem; }
        input, textarea, select { width: 100%; padding: 0.75rem 1rem; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #fff; font-size: 0.95rem; margin-bottom: 1.25rem; transition: all 0.3s; }
        input:focus, textarea:focus, select:focus { outline: none; border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2); }
        .btn { width: 100%; padding: 0.9rem; background: linear-gradient(135deg, #2563eb, #1d4ed8); color: #fff; border: none; border-radius: 8px; font-weight: 700; font-size: 1rem; cursor: pointer; transition: all 0.3s; box-shadow: 0 4px 12px rgba(37,99,235,0.3); }
        .btn:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(37,99,235,0.4); }
        .btn-logout { background: #334155; margin-top: 0.75rem; box-shadow: none; }
        .btn-logout:hover { background: #475569; box-shadow: none; }
    </style>
</head>
<body>

    <!-- ОКНО ВХОДА -->
    <div id="auth-panel" class="card">
        <h2>Авторизация GitHub</h2>
        <label>Вставьте ваш Personal Access Token:</label>
        <input type="password" id="gh-token" placeholder="ghp_xxxxxxxxxxxx">
        <button class="btn" onclick="saveToken()">Войти в админку</button>
    </div>

    <!-- ИНТЕРФЕЙС ДОБАВЛЕНИЯ КОНТЕНТА -->
    <div id="cms-panel" class="card" style="display: none; max-width: 600px;">
        <h2>Добавить публикацию</h2>
        
        <label>Раздел сайта:</label>
        <select id="post-section">
            <option value="news">Новости</option>
            <option value="sector-legal">Правовой сектор</option>
            <option value="sector-culture">Культурный сектор</option>
            <option value="sector-sport">Спортивный сектор</option>
            <option value="sector-info">Информационный сектор</option>
            <option value="sector-household">Бытовой сектор</option>
        </select>

        <label>Заголовок:</label>
        <input type="text" id="post-title" placeholder="Введите заголовок">

        <label>Текст публикации:</label>
        <textarea id="post-text" rows="5" placeholder="Напишите text..."></textarea>

        <label>Ссылка на фото (необязательно):</label>
        <input type="text" id="post-img" placeholder="https://...">

        <button class="btn" id="submit-btn" onclick="uploadToGitHub()">Опубликовать на сайт</button>
        <button class="btn btn-logout" onclick="logout()">Выйти</button>
    </div>

    <script>
        const OWNER = "klenex1333";
        const REPO = "sovietggkjt";
        const FILE_PATH = "data.json";

        function saveToken() {
            const token = document.getElementById('gh-token').value.trim();
            if (!token) return alert('Введите токен!');
            localStorage.setItem('gh_cms_token', token);
            checkAuth();
        }

        function checkAuth() {
            if (localStorage.getItem('gh_cms_token')) {
                document.getElementById('auth-panel').style.display = 'none';
                document.getElementById('cms-panel').style.display = 'block';
            }
        }

        function logout() {
            localStorage.removeItem('gh_cms_token');
            location.reload();
        }

        async function uploadToGitHub() {
            const token = localStorage.getItem('gh_cms_token');
            const section = document.getElementById('post-section').value;
            const title = document.getElementById('post-title').value.trim();
            const text = document.getElementById('post-text').value.trim();
            const img = document.getElementById('post-img').value.trim();
            const btn = document.getElementById('submit-btn');

            if (!title || !text) return alert('Заполните заголовок и текст!');

            btn.disabled = true;
            btn.innerText = "Публикация...";

            const newPost = {
                id: Date.now().toString(),
                section: section,
                title: title,
                text: text,
                img: img,
                date: new Date().toLocaleDateString('ru-RU'),
                views: 0
            };

            const url = `https://github.com{OWNER}/${REPO}/contents/${FILE_PATH}`;
            
            try {
                // ИСПРАВЛЕНО: Добавлены CORS-заголовки для безопасности запросов
                const res = await fetch(url, { 
                    mode: 'cors',
                    headers: { 
                        'Authorization': `Bearer ${token}`,
                        'Accept': 'application/vnd.github.v3+json'
                    } 
                });
                
                if (!res.ok) throw new Error('Ошибка авторизации. Проверьте правильность токена и наличие галочки repo.');
                
                const fileData = await res.json();
                const sha = fileData.sha;
                const currentContent = JSON.parse(atob(fileData.content.replace(/\s/g, '')));

                if (!currentContent.posts) currentContent.posts = [];
                currentContent.posts.unshift(newPost);

                const updateRes = await fetch(url, {
                    method: 'PUT',
                    mode: 'cors',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Accept': 'application/vnd.github.v3+json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: "Добавлена новая публикация через админку",
                        content: btoa(unescape(encodeURIComponent(JSON.stringify(currentContent, null, 2)))),
                        sha: sha,
                        branch: "main"
                    })
                });

                if (updateRes.ok) {
                    alert('Публикация успешно добавлена! Сайт обновится на GitHub Pages через 30-60 секунд.');
                    document.getElementById('post-title').value = '';
                    document.getElementById('post-text').value = '';
                    document.getElementById('post-img').value = '';
                } else {
                    alert('Ошибка записи на GitHub. Проверьте права токена.');
                }
            } catch (err) {
                alert(err.message);
            } finally {
                btn.disabled = false;
                btn.innerText = "Опубликовать на сайт";
            }
        }

        checkAuth();
    </script>
</body>
</html>
